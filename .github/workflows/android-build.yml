name: Android build validation

on:
  push:
    paths:
      - "android/**"
      - "scoring.py"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate offline dermatology knowledge
        run: python3 tools/validate_derm_knowledge.py

      - name: Generate Python-reference scoring golden vectors
        run: python3 android/tools/generate_scoring_golden_vectors.py

      - name: Run offline scoring regression tests
        run: gradle -p android :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle -p android assembleDebug

      - name: Build release APK
        run: gradle -p android assembleRelease

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medconsults-derm-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
